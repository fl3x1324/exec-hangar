# docker compose up -d --build
# Put ADMIN_TOKEN=... (and optionally HELPER_TOKEN=...) in a .env file next to this file (see .env.example).
services:
  exec-hangars:
    build: .
    image: exec-hangars:latest
    restart: unless-stopped
    init: true
    ports:
      - "${PORT:-3000}:3000"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      HELPER_TOKEN: ${HELPER_TOKEN:-}
    volumes:
      - exec-hangars-data:/data

volumes:
  exec-hangars-data:
